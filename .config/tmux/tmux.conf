source-file ~/.config/tmux/tmux.reset.conf

set -g extended-keys on
set -g extended-keys-format csi-u

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g prefix C-a

set -g base-index 1
setw -g pane-base-index 1

set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard

set -g mouse on

set-window-option -g mode-keys vi

set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# tmux-palette: command palette (panes, windows, sessions, popups, themes)
set -g @plugin 'eduwass/tmux-palette'
set -g @palette-key 'off'                 # disable plugin bind; use fast launcher below
# Custom launcher skips the plugin's blocking bun --measure pass (single
# bun start, popup appears instantly). Lives in dotfiles, survives updates.
# Bound under prefix (not a bare key) so it can't collide with C-k, which
# shells use for kill-line and vim-tmux-navigator uses for pane-up nav.
bind k run-shell -b "~/.config/tmux/scripts/tmux-palette.sh"
bind л run-shell -b "~/.config/tmux/scripts/tmux-palette.sh"   # Russian layout: same physical key as k

set -g @plugin 'omerxx/tmux-floax'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-bind 'p'
set -g @floax-change-path 'true'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

set -g @plugin 'christoomey/vim-tmux-navigator'
# Move pane-up nav off bare C-k so shell readline (kill-line) and vim (insert
# digraph) get it back; C-h/C-j/C-l pane nav is unaffected.
set -g @vim_navigator_mapping_up 'C-Up'

set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_status_right_separator "#[fg=#{@thm_bg},reverse]#[none]"
# Load catppuccin BEFORE building the status bar: the `set -agF` lines below
# expand @catppuccin_status_* at config-read time, so without this the cpu and
# session segments bake in empty on first boot and only appear after a manual
# reload (prefix + R). tpm re-sources the theme later, which is harmless.
run '~/.config/tmux/plugins/tmux/catppuccin.tmux'

set -g status-bg "#1e1e2e" # @thm_bg
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#[fg=#{@thm_bg},reverse] #[none]"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#[fg=#{@thm_bg},reverse] #[none]"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -ag status-right "#[fg=#{@thm_bg},reverse] #[none]"
set -agF status-right "#{@catppuccin_status_session}"
set -g pane-border-status top
set -g pane-border-format ''
set-option -g status-position top
set-hook -g client-session-changed 'refresh-client -S'
set -g status-interval 1

# tpm stays below the status bar block: it loads tmux-cpu, which rewrites the
# baked-in #{cpu_percentage} placeholder into its metric command.
run '~/.config/tmux/plugins/tpm/tpm'

# Fix the rename-window / command-prompt input overlapping the window titles.
# Catppuccin sets message-style + message-command-style with `align=centre` and
# no `fill`, so the prompt paints only its own centred cells while the live window
# list and status-right stay visible underneath — the rename input lands on top of
# the window titles. `fill` clears the whole status line the way tmux's stock prompt
# does; `align=left` also stops the re-centre-on-every-keystroke jitter while typing.
# Must run AFTER tpm: tpm re-sources catppuccin, which resets these styles and would
# clobber an earlier override. Appending (-a) keeps catppuccin's flavor colors.
set -agF message-style "align=left,fill=#{@thm_bg}"
set -agF message-command-style "align=left,fill=#{@thm_bg}"
