# First remove *all* keybindings
# unbind-key -a
# Now reinsert all the regular tmux keys
bind ^X lock-server
bind c new-window -c "$HOME"
bind ^D detach

bind H previous-window
bind L next-window

bind r command-prompt "rename-window %%"
bind R source-file ~/.config/tmux/tmux.conf
bind ^A last-window
bind ^W list-windows
bind w list-windows
bind z resize-pane -Z
# Splits follow the visual mnemonic: | cuts side-by-side, _ stacks top/bottom.
# The stock % binding is dropped so every split keeps the current path.
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind s choose-tree -Zs
bind '"' choose-window
bind h select-pane -L
bind j select-pane -D
# k/л belong to tmux-palette (bound in tmux.conf); pane-up nav lives on
# C-Up via vim-tmux-navigator and on prefix+Up.
bind l select-pane -R
bind -r -T prefix , resize-pane -L 20
bind -r -T prefix . resize-pane -R 20
bind -r -T prefix - resize-pane -D 7
bind -r -T prefix = resize-pane -U 7
bind : command-prompt
bind * setw synchronize-panes
# P belongs to the floax menu (bound by the plugin after tpm runs).

bind x swap-pane -D
bind S new-session
bind K send-keys "clear"\; send-keys "Enter"
bind-key -T copy-mode-vi v send-keys -X begin-selection

# --- Russian (ЙЦУКЕН) layout: duplicate each bind on the Cyrillic char that
# --- shares the same physical key, so prefix motions work in any layout.
# --- Ctrl-combos (C-a, C-x, ...) are omitted: control codes are layout-agnostic.
bind с new-window -c "$HOME"                              # c
bind Ё split-window -h -c "#{pane_current_path}"          # | (Apple Russian layout types Ё on that key)
bind ы choose-tree -Zs                                    # s
bind Р previous-window                                    # H
bind Д next-window                                        # L
bind к command-prompt "rename-window %%"                  # r
bind К source-file ~/.config/tmux/tmux.conf               # R
bind ц list-windows                                       # w
bind я resize-pane -Z                                     # z
bind Э choose-window                                      # "
bind р select-pane -L                                     # h
bind о select-pane -D                                     # j
bind д select-pane -R                                     # l
bind -r -T prefix б resize-pane -L 20                     # ,
bind -r -T prefix ю resize-pane -R 20                     # .
bind Ж command-prompt                                     # :
bind ч swap-pane -D                                       # x
bind Ы new-session                                        # S
bind Л send-keys "clear"\; send-keys "Enter"              # K
bind-key -T copy-mode-vi м send-keys -X begin-selection   # v
